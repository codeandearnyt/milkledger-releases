<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="MilkLedger — animated banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1e3f"/>
      <stop offset="0.5" stop-color="#123a7a"/>
      <stop offset="1" stop-color="#0b1e3f"/>
    </linearGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#7fd4ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ea3ff"/>
      <stop offset="0.5" stop-color="#9adcff"/>
      <stop offset="1" stop-color="#4ea3ff"/>
    </linearGradient>
    <clipPath id="textClip">
      <text x="480" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="2">MilkLedger</text>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="960" height="320" fill="url(#sky)"/>
  <ellipse cx="480" cy="330" rx="520" ry="60" fill="#eaf7ff" opacity="0.06" filter="url(#soft)"/>

  <!-- title with shimmer -->
  <g clip-path="url(#textClip)">
    <rect x="0" y="40" width="960" height="120" fill="url(#mg)"/>
    <rect x="-320" y="40" width="240" height="120" fill="#ffffff" opacity="0.35">
      <animate attributeName="x" from="-320" to="1040" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="480" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="2" fill="none" stroke="#7fd4ff" stroke-width="1" opacity="0.9">MilkLedger</text>

  <!-- tagline -->
  <text x="480" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#b8d9ff">
    Your dairy ledger, reimagined — quantity shortcuts · per-seller rates · reports · reminder
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- animated milk waves -->
  <g transform="translate(0,200)">
    <path d="M0,40 C80,10 160,70 240,40 S400,10 480,40 S640,70 720,40 S880,10 960,40 V120 H0 Z" fill="url(#waveGrad)" opacity="0.7">
      <animate attributeName="d"
        values="M0,40 C80,10 160,70 240,40 S400,10 480,40 S640,70 720,40 S880,10 960,40 V120 H0 Z;
                M0,45 C80,15 160,75 240,45 S400,15 480,45 S640,75 720,45 S880,15 960,45 V120 H0 Z;
                M0,40 C80,10 160,70 240,40 S400,10 480,40 S640,70 720,40 S880,10 960,40 V120 H0 Z"
        dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M0,70 C80,40 160,100 240,70 S400,40 480,70 S640,100 720,70 S880,40 960,70 V120 H0 Z" fill="#eaf7ff" opacity="0.35">
      <animate attributeName="d"
        values="M0,70 C80,40 160,100 240,70 S400,40 480,70 S640,100 720,70 S880,40 960,70 V120 H0 Z;
                M0,75 C80,45 160,105 240,75 S400,45 480,75 S640,105 720,75 S880,45 960,75 V120 H0 Z;
                M0,70 C80,40 160,100 240,70 S400,40 480,70 S640,100 720,70 S880,40 960,70 V120 H0 Z"
        dur="3.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- rising bubbles -->
  <g fill="#ffffff">
    <circle cx="120" cy="250" r="6" opacity="0.7">
      <animate attributeName="cy" from="300" to="180" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="250" r="4" opacity="0.6">
      <animate attributeName="cy" from="320" to="190" dur="5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0" dur="5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="250" r="5" opacity="0.7">
      <animate attributeName="cy" from="310" to="185" dur="4.4s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0" dur="4.4s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="250" r="4" opacity="0.6">
      <animate attributeName="cy" from="300" to="190" dur="5.6s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0" dur="5.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
