<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-label="MilkLedger - milk accounts, settled">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070d19"/>
      <stop offset="0.55" stop-color="#0c162c"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(170 80) rotate(48) scale(340 310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f6df6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f6df6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1040 320) rotate(-140) scale(380 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#a9c8ff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-0.9;0.8" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.1;1.8" dur="7.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="dropGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f7ff"/>
      <stop offset="0.5" stop-color="#a9c8ff"/>
      <stop offset="1" stop-color="#5b8dff"/>
    </linearGradient>

    <linearGradient id="sheen" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-1.3;1.1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.3;2.1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="frame">
      <rect width="1200" height="360" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#glowA)"/>
    <rect width="1200" height="360" fill="url(#glowB)"/>
    <rect width="1200" height="360" fill="url(#sheen)"/>

    <!-- slow rising bubbles -->
    <g fill="#9dc0ff">
      <circle cx="120" cy="330" r="3.5" opacity="0"><animate attributeName="cy" values="350;-30" dur="11s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0" dur="11s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="330" r="2.5" opacity="0"><animate attributeName="cy" values="350;-30" dur="15s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.35;0" dur="15s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="330" r="3" opacity="0"><animate attributeName="cy" values="350;-30" dur="13s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.4;0" dur="13s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="330" r="4" opacity="0"><animate attributeName="cy" values="350;-30" dur="16s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.3;0" dur="16s" begin="5s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="330" r="2.5" opacity="0"><animate attributeName="cy" values="350;-30" dur="12s" begin="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.35;0" dur="12s" begin="8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- logo tile -->
    <g transform="translate(88,112)">
      <rect width="118" height="118" rx="30" fill="#0e1b35" stroke="#2b4a86" stroke-width="2"/>
      <rect width="118" height="118" rx="30" fill="url(#glowA)" opacity="0.4"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4.2s" repeatCount="indefinite"/>
        <path d="M59 24c0 0 27 25.6 27 44.2C86 83.6 73.9 95 59 95S32 83.6 32 68.2C32 49.6 59 24 59 24Z" fill="url(#dropGrad)"/>
        <ellipse cx="47" cy="52" rx="7" ry="10" fill="#ffffff" opacity="0.55" transform="rotate(-18 47 52)"/>
        <path d="M46 72c4.5 6 21 6 26 0" stroke="#0e1b35" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>
      </g>
    </g>

    <!-- wordmark -->
    <text x="234" y="164" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#ink)">MilkLedger</text>
    <text x="238" y="208" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#93a7c8">Milk accounts, settled. Every morning, every evening.</text>

    <!-- feature pills -->
    <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
      <g transform="translate(238,244)">
        <rect width="112" height="38" rx="19" fill="#11203c" stroke="#2a4a7f" stroke-width="1.2"/>
        <text x="56" y="24" text-anchor="middle" fill="#bcd4ff">4 plans</text>
      </g>
      <g transform="translate(362,244)">
        <rect width="164" height="38" rx="19" fill="#11203c" stroke="#2a4a7f" stroke-width="1.2"/>
        <text x="82" y="24" text-anchor="middle" fill="#bcd4ff">PDF · WhatsApp</text>
      </g>
      <g transform="translate(538,244)">
        <rect width="146" height="38" rx="19" fill="#11203c" stroke="#2a4a7f" stroke-width="1.2"/>
        <text x="73" y="24" text-anchor="middle" fill="#bcd4ff">Ads-free option</text>
      </g>
    </g>

    <!-- rule -->
    <rect x="88" y="316" width="1024" height="1" fill="#1c2b47"/>
  </g>
</svg>
