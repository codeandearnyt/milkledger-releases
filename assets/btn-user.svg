<svg xmlns="http://www.w3.org/2000/svg" width="440" height="96" viewBox="0 0 440 96" fill="none" role="img" aria-label="Download MilkLedger user app">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="440" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f6df6"/>
      <stop offset="1" stop-color="#1a4bcc"/>
    </linearGradient>
    <linearGradient id="shine" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-1.1;1.4" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.1;2.4" dur="3.8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="440" height="96" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="440" height="96" fill="url(#face)"/>
    <rect width="440" height="96" fill="url(#shine)"/>
  </g>
  <rect x="0.75" y="0.75" width="438.5" height="94.5" rx="23.25" stroke="url(#rim)" stroke-width="1.5"/>

  <circle cx="58" cy="48" r="25" fill="#ffffff" fill-opacity="0.14"/>
  <g stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 34v19"/>
    <path d="M49 45l9 9 9-9" fill="none"/>
    <path d="M43 69h30"/>
  </g>

  <text x="100" y="44" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Download · User app</text>
  <text x="100" y="69" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#d3e1ff">v1.0.0 · 83.7 MB · Android 6.0+</text>
</svg>
